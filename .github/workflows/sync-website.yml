name: Sync website release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      ARC_KIT_SITE_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 要同步到官网的已发布版本，例如 v0.1.0
        type: string
        required: true

concurrency:
  group: sync-website-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: huixiangyang/arc-kit-site
          ref: main
          ssh-key: ${{ secrets.ARC_KIT_SITE_DEPLOY_KEY }}
          # 专用 Deploy Key 只绑定官网仓库，由 checkout 在任务结束时清理。
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify release before changing website
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/sync_release.py --tag "$RELEASE_TAG"
          python3 scripts/build.py
          python3 -m unittest discover -s tests
      - name: Push version and trigger website deployment
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git config user.name 'arc-kit-release[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/release.json
          # 同版本手动重试也触发一次部署，不重复创建应用 Release。
          git commit --allow-empty -m "release: sync Arc Kit $RELEASE_TAG"
          git push origin HEAD:main
          echo "已同步 $RELEASE_TAG；部署结果见 https://github.com/huixiangyang/arc-kit-site/actions/workflows/deploy.yml" >> "$GITHUB_STEP_SUMMARY"
